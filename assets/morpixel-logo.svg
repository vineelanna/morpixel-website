<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 170" role="img" aria-label="MORPIXEL Designlab">
  <defs>
    <linearGradient id="peacockGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d4a5"/>
      <stop offset="0.45" stop-color="#e5b879"/>
      <stop offset="1" stop-color="#b98259"/>
    </linearGradient>
  </defs>

  <!-- Standalone elegant peacock line-art mark -->
  <g transform="translate(14,5)" fill="none" stroke="url(#peacockGold)"
     stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- alert, upright neck and head -->
    <path d="M92 31
             C73 39,66 57,72 74
             C77 89,91 94,94 111
             C97 128,88 142,73 151"/>
    <path d="M92 31
             C108 37,116 49,116 63
             C116 77,107 87,95 93"/>
    <!-- face + beak -->
    <path d="M90 32 C96 25,105 23,113 27"/>
    <path d="M113 27 L126 32 L113 36"/>
    <circle cx="102" cy="30" r="2.4" fill="#f0c791" stroke="none"/>

    <!-- crown -->
    <path d="M93 22 C89 15,90 9,95 4"/>
    <path d="M101 21 C101 13,105 8,110 5"/>
    <path d="M108 23 C112 16,117 13,123 14"/>
    <circle cx="95" cy="4" r="2.8" fill="#f0c791" stroke="none"/>
    <circle cx="110" cy="5" r="2.8" fill="#f0c791" stroke="none"/>
    <circle cx="123" cy="14" r="2.8" fill="#f0c791" stroke="none"/>

    <!-- lifted chest / body -->
    <path d="M95 92 C83 104,78 117,80 132"/>
    <path d="M94 111 C104 123,106 136,101 149"/>

    <!-- elegant upward fan: flowing feather lines -->
    <path d="M78 106 C58 96,38 99,19 116 C42 116,60 126,72 142"/>
    <path d="M76 111 C55 109,39 116,26 132"/>
    <path d="M76 118 C58 121,46 132,39 146"/>
    <path d="M79 124 C65 132,57 142,53 153"/>
  </g>

  <!-- Wordmark -->
  <g fill="#f7f8fb">
    <text x="170" y="80" font-family="Inter,Arial,sans-serif"
          font-size="62" font-weight="750" letter-spacing="6.5">MORPIXEL</text>
    <text x="175" y="126" font-family="Inter,Arial,sans-serif"
          font-size="23" font-weight="450" letter-spacing="13.5">DESIGNLAB</text>
  </g>
</svg>